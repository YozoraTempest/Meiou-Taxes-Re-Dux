l_english:
 redux_test_blocked_title:0 "Redux Test：01：10 单位订单被限制为 2 个槽"
 redux_test_same_type_title:0 "Redux Test：02：同建筑类型、不同出资方"
 redux_test_different_type_title:0 "Redux Test：03：不同建筑类型共用施工槽"
 redux_test_width_two_title:0 "Redux Test：04：真实并发 2 的对照组"
 redux_test_manual_title:0 "Redux Test：05：先建阶级并发 2，再手动追加"
 redux_test_release_title:0 "Redux Test：释放占位工程"
 redux_test_refill_title:0 "Redux Test：执行补槽并核验"
 redux_test_advance_title:0 "Redux Test：满供给推进一次施工检查"
 redux_test_cleanup_title:0 "Redux Test：清理剩余测试工程"
 redux_test_status_title:0 "Redux Test：查看施工状态"
 redux_test_native_event_title:0 "Redux Test：触发 Tweak 实际补槽事件"
 redux_test_blocked_desc:0 "在恰好一个已选中、没有在建工程的本国省份中建立测试。四笔阶级订单先占用 8 个槽，随后建立 10 单位设施工程，请求并发 10，但只能分配到剩余 2 个槽。确认后依次使用「释放占位工程」和「执行补槽并核验」。即时测试期间请保持暂停。"
 redux_test_same_type_desc:0 "先建立阶级出资的 2 单位设施工程，使用 2 个槽；再建立玩家出资的 10 单位设施工程，请求并发 10。预期阶级占 2 槽、玩家占 8 槽。补槽应保留阶级的并发上限 2，并分别核算出资方。"
 redux_test_different_type_desc:0 "先建立阶级出资的 2 单位道路工程，使用 2 个槽；再建立玩家出资的 10 单位设施工程，请求并发 10。预期道路占 2 槽、设施占 8 槽。不同建筑类型仍共用每省 10 个施工槽。"
 redux_test_width_two_desc:0 "建立 10 单位玩家设施工程，订单中保存的请求并发为 2。即使还有空槽，补槽也应保持实际并发 2。满供给推进一次施工检查后，应完成 2 单位并剩余 8 单位。"
 redux_test_manual_desc:0 "只建立阶级出资的 2 单位道路工程，并发为 2。随后使用平时的 MT 建设窗口，在此省手动追加一笔 10 单位基础设施订单。使用「查看施工状态」比较窗口设置、订单保存的请求并发与实际活动槽数。这个场景用于检查真实手动下单入口。"
 redux_test_release_desc:0 "只取消场景 01 中阶级出资的道路占位工程，释放 8 个槽。取消过程更新 MT 的在建数量与并发显示，不增加已建成道路。玩家队列仍应占用 2 个槽，直到执行补槽。"
 redux_test_refill_desc:0 "先记录活动槽、待建总量、剩余资源、出资方、请求并发和相关资金，再调用已安装的 Redux Tweak 补槽效果。结果事件分别显示槽位分配、总量守恒、已有进度和资金的通过或失败。适用于一笔玩家订单；多笔不同类型或不同请求并发的玩家订单会报告分组混合。"
 redux_test_advance_desc:0 "暂时将测试省份的材料与劳动供给率设为 100%，每个施工槽执行一次 MT 原施工检查，然后恢复原供给率。此操作会实际完成建筑单位，用于比较并发 2 与并发 10 的完成量；不模拟年度付款、市场采购或劳动来源。"
 redux_test_cleanup_desc:0 "取消标记测试省份内所有尚未完成的基础设施队列，更新 MT 的施工统计并移除测试标记。测试中实际建成的单位与已经支付的费用保留。此操作不是存档回滚；测试期间请勿在该省追加无关工程。"
 redux_test_status_desc:0 "省份：[Root.GetName]　场景：[Root.ReduxTestScenario.GetValue]\n\n窗口请求并发：[Root.Owner.ReduxTestWindowWidth.GetValue]\n订单保存的请求并发：[Root.ReduxTestWidth.GetValue]\n玩家建筑类型 ID：[Root.ReduxTestType.GetValue]\n\n实际活动槽：[Root.ReduxTestActive.GetValue] / 10\n玩家槽：[Root.ReduxTestManual.GetValue]　其他槽：[Root.ReduxTestOther.GetValue]\n玩家待建：[Root.ReduxTestManualUnits.GetValue]　全部待建：[Root.ReduxTestUnits.GetValue]\n补槽后预期玩家槽：[Root.ReduxTestExpected.GetValue]\n\n类型 ID：8 道路、9 港口、10 设施、11 灌溉、12/13 首府、14 驻军。实际并发按活动槽统计，窗口值按 MT 的内部选择加 1。多笔不同类型或不同请求并发的玩家订单超出单订单核验范围。"
 redux_test_native_event_desc:0 "对 MT 控制国家 AAA 触发已安装的 ReduxConstruction.1，执行 Tweak 实际补槽事件，影响全部有效省份。推进 1 天后显示测试省份的新状态。此决议检查事件入口；若要检查月度钩子，请释放占位工程后不手动补槽，让游戏自然进入二月。"
 redux_test_pass_title:0 "Redux Test：补槽核验通过"
 redux_test_fail_title:0 "Redux Test：补槽核验失败"
 redux_test_audit_desc:0 "省份：[Root.GetName]\n玩家槽：[Root.ReduxTestBeforeManual.GetValue] → [Root.ReduxTestManual.GetValue]　预期：[Root.ReduxTestBeforeExpected.GetValue]\n全部活动槽：[Root.ReduxTestBeforeActive.GetValue] → [Root.ReduxTestActive.GetValue]\n全部待建单位：[Root.ReduxTestBeforeUnits.GetValue] → [Root.ReduxTestUnits.GetValue]\n\n槽位分配：[Root.GetReduxTestSlotsResult]\n待建总量与 MT 统计：[Root.GetReduxTestTotalsResult]\n已有资源进度、出资方、请求并发和支出：[Root.GetReduxTestProgressResult]\n相关省份资金与累计支出：[Root.GetReduxTestFundsResult]\n\n真实请求并发 2 应保持 2。验证从 2 扩展到 10，请先在场景 01 中释放占位工程。此报告核验即时补槽操作；自然年度结算与二月钩子需另行推进时间观察。"
 redux_test_advance_result_title:0 "Redux Test：满供给施工结果"
 redux_test_advance_result_desc:0 "省份：[Root.GetName]\n检查前活动槽：[Root.ReduxTestBeforeActive.GetValue]\n实际完成单位：[Root.ReduxTestCompleted.GetValue]\n减少的待建单位：[Root.ReduxTestConsumed.GetValue]\n剩余待建单位：[Root.ReduxTestUnits.GetValue]\n\n满供给时，实际完成单位和减少的待建单位应等于检查前活动槽数。场景 01 扩展到 10 槽后，本次应完成全部 10 单位；真实并发 2 的对照组每次应完成 2 单位。原供给率已恢复，此操作不模拟年度付款。"
 redux_test_cleanup_result_title:0 "Redux Test：测试队列已清理"
 redux_test_cleanup_result_desc:0 "[Root.GetName] 的剩余基础设施队列已取消，测试标记已移除，MT 的在建数量与并发统计已更新。取消操作中临时增加的建成单位已抵消。实际完成的建筑和此前支付的费用保留。选择一个空闲省份可开始下一项测试。"
 redux_test_invalid_title:0 "Redux Test：当前条件不满足"
 redux_test_invalid_desc:0 "省份或场景状态已不满足条件。建立新场景时，恰好选择一个没有施工工程的本国有效省份，并避开人口模拟与建设冻结。清理会保留不受支持的产业项目（ID 1–7）；若仍有此类项目，测试标记保留，请通过 MT 完成或取消后再次清理。"
 redux_test_start_requirements:0 "恰好选择一个本国有效省份，该省没有任何在建工程、本国没有其他测试省份，且未处于人口模拟或建设冻结。请使用专门的测试存档。"
 redux_test_start:0 "建立测试工程"
 redux_test_confirm:0 "执行此项测试"
 redux_test_cancel:0 "取消"
 redux_test_ok:0 "确定"
 redux_test_pass:0 "§G通过§!"
 redux_test_fail:0 "§R失败§!"
